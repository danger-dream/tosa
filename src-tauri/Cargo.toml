[package]
name = "tosa"
version = "0.1.0"
description = "Translate OCR Selection Autohotkey"
authors = ["danger-dream"]
license = "MIT"
repository = "https://www.github.com/danger-dream/tosa"
edition = "2021"
rust-version = "1.81"


[build-dependencies]
tauri-build = { version = "2.0.0-rc.12", features = [] }

[dependencies]
window-shadows = "0.2.2"
tauri = { version = "2.0.0-rc.15", features = [
	"devtools", "tray-icon",
] }
tauri-plugin-single-instance = { version = "2.0.0-rc.4" }
tauri-plugin-positioner = { version = "2.0.0-rc.1" }
tauri-plugin-autostart = { version = "2.0.0-rc.1" }
tauri-plugin-store = "2.0.0-rc"
tauri-plugin-log = "2.0.0-rc"
serde = { version = "1.0.210", features = ["derive"] }
selection = "1.1.1"
serde_json = "1.0.128"
screenshots = "0.7.3"
dirs = "5.0.1"
once_cell = "1.19.0"
log = "0.4.20"
mouse_position = "0.1.3"
libloading = "0.8"
widestring = "1.0"
image = "0.24"
base64 = "0.21"
lazy_static = "1"
active-win-pos-rs = "0.8"
enigo = "0.1"
arboard = "3.3"
mouce = "0.2"
regex = "1"
whichlang = "0.1.0"
jieba-rs = "0.6.8"
tauri-plugin-notification = "2.0.0-rc"
tauri-plugin-dialog = "2.0.0-rc"
tauri-plugin-fs = "2.0.0-rc"
tauri-plugin-http = "2.0.0-rc"
tauri-plugin-clipboard-manager = "2.1.0-beta.7"
tauri-plugin-os = "2.0.0-rc"
tauri-plugin-process = "2.0.0-rc"
tauri-plugin-shell = "2.0.0-rc"
tauri-plugin-upload = "2.0.0-rc"
tauri-plugin-websocket = "2.0.0-rc"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
	"Win32_UI_WindowsAndMessaging",
	"Win32_Foundation",
	"Win32_System_Threading",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_System_DataExchange",
	"Win32_UI_Accessibility",
	"Win32_System_Com",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.0.0-rc"
#tauri-plugin-cli = "2.0.0-rc"
tauri-plugin-global-shortcut = "2.0.0-rc"
tauri-plugin-single-instance = "2.0.0-rc"
#tauri-plugin-updater = "2.0.0-rc"
tauri-plugin-window-state = "2.0.0-rc"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
lto = true
codegen-units = 1
panic = "abort"
